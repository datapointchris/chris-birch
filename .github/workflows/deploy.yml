name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  build:
    needs: validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
